# Fleet OTel collector defaults (do-otelcol.service MemoryMax=256M).
#
# Phase 1 — backpressure: memory_limiter throttles intake before cgroup pressure; under sustained
# overload, data is dropped. batch caps records per export batch.
#
# Phase 2 — export best practices:
# - otlp → Insights: TLS to :443, gzip compression on the wire, bounded sending_queue + retries.
# - resource: stable service.name for downstream routing and dashboards.
# - debug: optional local diagnostics (also exported to journal); reduce verbosity in production if noisy.
# Add auth headers (or env-backed secrets) per Insights OTLP runbook if the endpoint requires them.
# Do not enable file_storage-backed queues without an explicit disk budget (unbounded spill risk).
receivers:
  journald:
    units: []
    priority: info
    start_at: end

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 180
    spike_limit_mib: 40
  resource:
    attributes:
      - key: team_id
        value: team_obsd
        action: upsert
  batch/logs:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s

exporters:
  otlp:
    endpoint: insights-otlp.digitalocean.com:443
    tls:
      insecure: false
    compression: gzip
    sending_queue:
      queue_size: 256
      num_consumers: 4
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s
  debug:
    # basic = summary per batch; detailed = full payloads (heavy on journal — avoid for wide fleet default).
    verbosity: basic

service:
  pipelines:
    logs:
      receivers: [journald]
      processors: [memory_limiter, resource, batch/logs]
      exporters: [otlp, debug]
