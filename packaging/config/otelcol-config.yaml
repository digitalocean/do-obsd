# GPU Droplet collector config — placeholder pending Nitish's validation.
# Log source and receiver to be confirmed on NVIDIA and AMD images.
receivers:
  filelog/kern:
    include:
      - /var/log/kern.log
    start_at: end

exporters:
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: "localhost:13134"

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [filelog/kern]
      exporters: [debug]
