name: cthulhu-release-dispatch

# On semver tag push, notify Cthulhu to run the do-obsd build/deploy pipeline
# (repository_dispatch type do-obsd-release; see cthulhu t--insights--do-obsd).

on:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: cthulhu-dispatch-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    if: github.repository == 'digitalocean/do-obsd'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cthulhu do-obsd-release
        env:
          TOKEN: ${{ secrets.CTHULHU_DISPATCH_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::CTHULHU_DISPATCH_TOKEN is not set. Add a PAT (or app token) with permission to create repository_dispatch on digitalocean/cthulhu."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://github.internal.digitalocean.com/api/v3/repos/digitalocean/cthulhu/dispatches" \
            -d "{\"event_type\":\"do-obsd-release\",\"client_payload\":{\"version\":\"${GITHUB_REF_NAME}\"}}"
