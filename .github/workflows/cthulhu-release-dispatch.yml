name: cthulhu-release-dispatch

# On semver tag push (or manual run), notify Cthulhu to run the do-obsd build/deploy
# pipeline (repository_dispatch type do-obsd-release; see cthulhu t--insights--do-obsd).
#
# Repo secret: CTHULHU_DISPATCH_TOKEN — PAT or GitHub App token with permission to
# POST /repos/digitalocean/cthulhu/dispatches on github.internal.digitalocean.com.

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver tag that exists on digitalocean/do-obsd (re-dispatch without a new tag push)"
        required: true
        type: string

concurrency:
  group: cthulhu-dispatch-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    if: github.repository == 'digitalocean/do-obsd'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME}"
          fi
          printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"

      - name: Validate version (MAJOR.MINOR.PATCH)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must match MAJOR.MINOR.PATCH (digits only), e.g. 1.2.3 — got: $VERSION"
            exit 1
          fi

      - name: Trigger Cthulhu do-obsd-release
        env:
          TOKEN: ${{ secrets.CTHULHU_DISPATCH_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::CTHULHU_DISPATCH_TOKEN is not set. Add a PAT (or app token) with permission to create repository_dispatch on digitalocean/cthulhu."
            exit 1
          fi
          BODY="$(jq -nc --arg v "$VERSION" '{event_type:"do-obsd-release",client_payload:{version:$v}}')"
          curl -fsS --retry 3 --retry-delay 5 --retry-connrefused \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://github.internal.digitalocean.com/api/v3/repos/digitalocean/cthulhu/dispatches" \
            -d "${BODY}"
          echo "::notice::Dispatched do-obsd-release for version ${VERSION} — check Actions on digitalocean/cthulhu"
